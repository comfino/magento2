<!-- Knockout.js template for classic Luma checkout theme -->
<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">
    <div class="payment-method-title field choice">
        <input type="radio" name="payment[method]" class="radio" data-bind="attr: {'id': getCode()}, value: getCode(), checked: isChecked, click: selectPaymentMethod, visible: isRadioButtonVisible()" />
        <label class="label" data-bind="attr: {for: getCode()}">
            <!-- ko if: getDefaultLogoUrl() -->
            <img class="comfino-payment-method-item__logo" data-comfino-logo data-bind="attr: {src: getDefaultLogoUrl(), alt: getTitle()}" />
            <!-- /ko -->
            <span data-bind="text: getTitle()"></span>
        </label>
    </div>
    <!--
        Hidden inputs live outside the `ko if isChecked()` gate so quote.totals.subscribe can write to #comfino-loan-amount
        regardless of selection, and so the loan-type/term inputs survive KO re-mounts during checkout state transitions
        (getData() reads them on order placement).
    -->
    <input id="comfino-loan-amount" name="comfino_loan_amount" type="hidden" />
    <input id="comfino-loan-type" name="comfino_loan_type" type="hidden" />
    <input id="comfino-loan-term" name="comfino_loan_term" type="hidden" />
    <!-- ko if: (getCode() == isChecked()) -->
    <div class="payment-method-content">
        <!-- Comfino web frontend SDK renders paywall iframe here. -->
        <div id="comfino-paywall-container"></div>
        <!-- ko foreach: getRegion('messages') -->
        <!-- ko template: getTemplate() --><!-- /ko -->
        <!--/ko-->
        <div class="payment-method-billing-address">
            <!-- ko foreach: $parent.getRegion(getBillingAddressFormName()) -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="checkout-agreements-block">
            <!-- ko foreach: $parent.getRegion('before-place-order') -->
            <!-- ko template: getTemplate() --><!-- /ko -->
            <!--/ko-->
        </div>
        <div class="actions-toolbar">
            <div class="primary">
                <button class="action primary checkout" type="submit" data-bind="click: placeOrder, attr: {title: $t('Go to payment')}, css: {disabled: !isPlaceOrderActionAllowed()}, enable: isPlaceOrderActionAllowed()">
                    <span data-bind="i18n: 'Go to payment'"></span>
                </button>
            </div>
        </div>
    </div>
    <!-- /ko -->
</div>
